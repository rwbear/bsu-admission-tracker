<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Проход — радар конкурса БГУ: выбери факультет, введи балл, смотри шансы." />
  <title>Проход — БГУ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div class="site">
    <header class="command" id="command">
      <div class="wrap command-inner">
        <a class="command-brand" href="#top">r.w.b.&nbsp;|&nbsp;production</a>
        <div class="command-meta" id="update-status" title="Автообновление каждые 10 минут">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="command-time">Загрузка</span>
          <span class="command-sep" aria-hidden="true">·</span>
          <span id="next-update"></span>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="hero-block wrap">
        <form class="score-form" id="score-form">
          <label class="sr-only" for="score-input">Сумма баллов</label>
          <input
            class="score-input"
            id="score-input"
            name="score"
            type="number"
            inputmode="numeric"
            min="0"
            max="500"
            step="1"
            placeholder="Балл"
            required
          />
          <button class="btn-apply" type="submit">Применить</button>
        </form>
      </section>

      <div id="data-banner" class="banner wrap hidden" role="status"></div>

      <section class="board wrap" id="board">
        <div class="stream">
          <div id="faculty-picker-mount" class="faculty-silence-mount"></div>
        </div>

        <div id="state-loading" class="state-box panel hidden">
          <h2>Загрузка</h2>
          <p>Тянем снимок конкурса…</p>
          <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>

        <div id="state-empty" class="state-box panel hidden">
          <h2>Введи балл</h2>
          <p>Факультет сверху — фильтр по длинному списку специальностей. Затем — балл.</p>
        </div>

        <div id="state-error" class="state-box panel hidden">
          <h2>Ошибка данных</h2>
          <p id="error-msg"></p>
          <button class="btn-apply" id="retry-btn" type="button">Повторить</button>
        </div>

        <div id="results" class="results hidden">
          <div class="summary" id="summary-strip" aria-live="polite"></div>

          <div class="master-detail">
            <div class="overview-col">
              <div class="zone-label">Обзор</div>
              <div class="panel stream-list" id="overview-list"></div>
            </div>
            <div class="detail-col">
              <div class="zone-label">Детали</div>
              <div class="panel" id="detail-panel"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <a href="https://abit.bsu.by/formk1?id=7" id="source-link" target="_blank" rel="noopener">abit.bsu.by</a>
        <span>Расчётный проходной — не приказ</span>
      </div>
    </footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>

<body>
  <div class="site">
    <header class="command" id="command">
      <div class="wrap command-inner">
        <a class="command-brand" href="#top">r.w.b.&nbsp;|&nbsp;production</a>
        <button
          type="button"
          class="command-meta"
          id="update-status"
          aria-haspopup="dialog"
          aria-controls="updates-overlay"
          aria-expanded="false"
          title="Загружаем данные · нажми, чтобы узнать подробнее"
        >
          <span class="live-dot" aria-hidden="true"></span>
          <span class="command-meta-data" id="command-data">данные —</span>
          <span class="command-meta-next" id="command-next">след —</span>
        </button>
        <span class="sr-only" id="update-live-region" aria-live="polite"></span>
      </div>
    </header>

    <main id="top">
      <section class="hero-block wrap">
        <div id="table-picker-mount" class="table-picker-mount"></div>
        <div id="faculty-picker-mount" class="faculty-picker-mount"></div>

        <form class="score-form" id="score-form">
          <label class="sr-only" for="score-input">Сумма баллов</label>
          <input
            class="score-input"
            id="score-input"
            name="score"
            type="number"
            inputmode="numeric"
            min="0"
            max="500"
            step="1"
            placeholder="Балл"
            required
          />
          <button class="btn-apply" type="submit">Применить</button>
        </form>
      </section>

      <div id="data-banner" class="banner wrap hidden" role="status"></div>

      <section class="board wrap" id="board">
        <div id="state-loading" class="state-box panel hidden">
          <h2>Загрузка</h2>
          <p>Тянем снимок конкурса…</p>
          <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>

        <div id="state-empty" class="state-box panel hidden">
          <h2>Введи балл</h2>
          <p>Сверху — таблица мониторинга и факультет. Дальше — обзор и детали.</p>
        </div>

        <div id="state-error" class="state-box panel hidden">
          <h2>Ошибка данных</h2>
          <p id="error-msg"></p>
          <button class="btn-apply" id="retry-btn" type="button">Повторить</button>
        </div>

        <div id="results" class="results hidden">
          <div class="summary" id="summary-strip" aria-live="polite"></div>

          <div class="master-detail">
            <div class="overview-col">
              <div class="zone-label">Обзор</div>
              <div class="panel" id="overview-list"></div>
            </div>
            <div class="detail-col">
              <div class="zone-label">Детали</div>
              <div class="panel" id="detail-panel"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <a href="https://abit.bsu.by/formk1?id=7" id="source-link" target="_blank" rel="noopener">abit.bsu.by</a>
        <span>Расчётный балл — не приказ</span>
      </div>
    </footer>
  </div>

  <script type="module" src="./js/main.js?v=20260718uc"></script>
</body>

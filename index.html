<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Проход — радар конкурса для Института бизнеса БГУ." />
  <title>Проход — Институт бизнеса БГУ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div class="site">
    <header class="command" id="command">
      <div class="wrap command-inner">
        <a class="command-brand" href="#top">ПРОХОД</a>
        <div class="command-meta">
          <span class="live-dot" aria-hidden="true"></span>
          <span id="command-time">LIVE</span>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="hero-block wrap">
        <h1 class="hero-sub">ИНСТИТУТ БИЗНЕСА БГУ</h1>

        <form class="score-form" id="score-form">
          <label class="sr-only" for="score-input">Сумма баллов</label>
          <input
            class="score-input"
            id="score-input"
            name="score"
            type="number"
            inputmode="numeric"
            min="0"
            max="500"
            step="1"
            placeholder="БАЛЛ"
            required
          />
          <button class="btn-apply" type="submit">ПРИМЕНИТЬ</button>
        </form>

        <div class="form-toggle" role="group" aria-label="Форма обучения">
          <button type="button" class="form-btn active" data-form="7" id="form-day">ДНЕВНАЯ</button>
          <button type="button" class="form-btn" data-form="8" id="form-zaoch">ЗАОЧНАЯ</button>
        </div>
      </section>

      <div id="data-banner" class="banner wrap hidden" role="status"></div>

      <section class="board wrap" id="board">
        <div id="state-loading" class="state-box frame hidden">
          <pre class="ascii-loading">ЗАГРУЗКА
[░░░░░░░░░░]</pre>
        </div>

        <div id="state-empty" class="state-box frame hidden">
          <h2>ВВЕДИ БАЛЛ</h2>
          <p>Сверху — обзор специальностей. Ниже — детали выбранной.</p>
        </div>

        <div id="state-error" class="state-box frame hidden">
          <h2>ОШИБКА ДАННЫХ</h2>
          <p id="error-msg"></p>
          <button class="btn-apply" id="retry-btn" type="button">ПОВТОРИТЬ</button>
        </div>

        <div id="results" class="results hidden">
          <div class="summary frame" id="summary-strip" aria-live="polite"></div>

          <div class="master-detail">
            <div class="overview-col">
              <div class="zone-label">ОБЗОР</div>
              <div class="frame" id="overview-list"></div>
            </div>
            <div class="detail-col">
              <div class="zone-label">ДЕТАЛИ</div>
              <div class="frame" id="detail-panel"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <a href="https://abit.bsu.by/formk1?id=7" id="source-link" target="_blank" rel="noopener">abit.bsu.by</a>
        <span>РАСЧЁТНЫЙ ПРОХОДНОЙ — НЕ ПРИКАЗ</span>
      </div>
    </footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>

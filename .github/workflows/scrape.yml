name: Scrape admission tables

# Schedules only run from the default branch (main) — and GitHub routinely
# drops high-frequency crons on public repos. We keep */5 as a backup, but the
# real cadence is a self-arming push tick (see "Arm next scrape").
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/admission-tracker-rebuild-be86"
    paths:
      - "data/.scrape-tick"
      - "scripts/scrape/**"
      - "sources/universities.json"
      - ".github/workflows/scrape.yml"
      - "js/compute.js"
      - "package.json"

permissions:
  contents: write
  pages: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Must cover scrape (~1 min) + arm sleep (4.5 min).
    timeout-minutes: 45
    concurrency:
      group: scrape-admission-data
      cancel-in-progress: false
    steps:
      - name: Resolve Pages / scrape branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(gh api "repos/${{ github.repository }}/pages" --jq '.source.branch' 2>/dev/null || true)
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            BRANCH="cursor/admission-tracker-rebuild-be86"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Scraping Pages branch: $BRANCH"

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        if: |
          github.event_name != 'schedule' &&
          !(github.event_name == 'push' && contains(github.event.head_commit.message, 'chore: arm next scrape'))
        run: npm test

      - name: Scrape universities
        id: scrape
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROHOD_DATA_BRANCH: ${{ steps.target.outputs.branch }}
        run: npm run scrape

      - name: Detect changes
        id: changes
        if: success()
        run: |
          if [ -f data/.changed ] && [ "$(cat data/.changed)" = "1" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f data/.changed

      - name: Fail soft retention on empty scrape
        id: retain_check
        if: success()
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          const path = 'data/sb-bsu.json';
          if (!existsSync(path)) {
            console.error('missing data/sb-bsu.json');
            process.exit(1);
          }
          const data = JSON.parse(readFileSync(path, 'utf8'));
          if (data.scrapeMeta?.retainedPrevious) {
            console.error('Scrape retained previous snapshot — live fetch failed.');
            console.error(JSON.stringify(data.scrapeErrors || [], null, 2));
            process.exit(1);
          }
          if (!data.specialties?.length) {
            console.error('No specialties after scrape');
            process.exit(1);
          }
          console.log('Fresh snapshot OK:', data.specialtyCount, 'rows @', data.updatedAt);
          EOF

      - name: Commit updated data
        if: success() && steps.changes.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "prohod-bot"
          git config user.email "prohod-bot@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh admission snapshots"
          git push origin "HEAD:${{ steps.target.outputs.branch }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish tip SHA
        if: success() && steps.commit.outputs.pushed == 'true'
        run: |
          SHA="${{ steps.commit.outputs.sha }}"
          BRANCH="${{ steps.target.outputs.branch }}"
          node --input-type=module <<EOF
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          const tipPath = 'data/latest.json';
          const tip = existsSync(tipPath)
            ? JSON.parse(readFileSync(tipPath, 'utf8'))
            : { universities: [] };
          tip.commitSha = process.env.TIP_SHA;
          tip.publishedAt = new Date().toISOString();
          writeFileSync(tipPath, JSON.stringify(tip, null, 2) + '\n');
          EOF
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "Tip already had sha"
            exit 0
          fi
          git commit -m "data: publish tip sha"
          git push origin "HEAD:${BRANCH}"
        env:
          TIP_SHA: ${{ steps.commit.outputs.sha }}

      # GitHub schedule is not trustworthy here (hours between fires). After every
      # attempt, wait ~4.5 minutes on the runner (free for public repos) and push
      # a tick that re-triggers this workflow — a reliable ~5-minute cadence.
      - name: Arm next scrape
        if: always() && !cancelled()
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -e
          echo "Waiting 270s before arming the next scrape…"
          sleep 270
          git config user.name "prohod-bot"
          git config user.email "prohod-bot@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p data
          date -u +%Y-%m-%dT%H:%M:%SZ > data/.scrape-tick
          git add data/.scrape-tick
          if git diff --staged --quiet; then
            # Force a new blob if the second resolution somehow matches.
            echo "armed $(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" > data/.scrape-tick
            git add data/.scrape-tick
          fi
          git commit -m "chore: arm next scrape"
          git push origin "HEAD:$BRANCH"
          echo "Armed next scrape on $BRANCH"

name: Scrape admission tables

# Schedules only run from the default branch (main). GitHub cron is unreliable
# here (can skip for 30+ minutes). Cadence is a self-arming chain:
# each run waits ~3 min, then `workflow_dispatch`s the next run.
#
# IMPORTANT: pushes with GITHUB_TOKEN do NOT start new workflow runs.
# `workflow_dispatch` (and `repository_dispatch`) ALWAYS do — even when
# invoked with GITHUB_TOKEN. See:
# https://docs.github.com/en/actions/using-workflows/triggering-a-workflow
#
# Preferred secret: SCRAPE_PROXY — stable HTTP proxy (cloud IPs cannot TLS
# to abit.bsu.by). When unset, Actions fall back to public proxy discovery
# with strict formk1/minBytes gates so tables cannot be wiped by junk HTML.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/admission-tracker-rebuild-be86"
    paths:
      - "scripts/scrape/**"
      - "sources/universities.json"
      - ".github/workflows/scrape.yml"
      - "js/compute.js"
      - "package.json"

permissions:
  contents: write
  actions: write
  pages: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Must cover scrape (~1–2 min) + arm sleep (180s).
    timeout-minutes: 45
    concurrency:
      group: scrape-admission-data
      cancel-in-progress: false
    steps:
      - name: Resolve Pages / scrape branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(gh api "repos/${{ github.repository }}/pages" --jq '.source.branch' 2>/dev/null || true)
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            BRANCH="cursor/admission-tracker-rebuild-be86"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Scraping Pages branch: $BRANCH"

      - name: Proxy channel
        id: proxy
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: |
          if [ -n "${SCRAPE_PROXY}" ]; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
            echo "SCRAPE_PROXY is set — trusted channel only."
          else
            echo "mode=public" >> "$GITHUB_OUTPUT"
            echo "::warning::SCRAPE_PROXY secret is not set. Falling back to public proxy discovery with formk1/minBytes gates. Add a stable proxy under Settings → Secrets → Actions for reliability."
          fi

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: npm test

      - name: Scrape universities
        id: scrape
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          # Trusted secret → pin to it. Missing secret → allow public discovery.
          SCRAPE_ALLOW_PUBLIC_PROXIES: ${{ steps.proxy.outputs.mode == 'trusted' && '0' || '1' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROHOD_DATA_BRANCH: ${{ steps.target.outputs.branch }}
        run: npm run scrape

      - name: Detect changes
        id: changes
        if: success()
        run: |
          if [ -f data/.changed ] && [ "$(cat data/.changed)" = "1" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f data/.changed

      - name: Fail soft retention on empty scrape
        id: retain_check
        if: success()
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          const path = 'data/sb-bsu.json';
          if (!existsSync(path)) {
            console.error('missing data/sb-bsu.json');
            process.exit(1);
          }
          const data = JSON.parse(readFileSync(path, 'utf8'));
          if (data.scrapeMeta?.retainedPrevious) {
            console.error('Scrape retained previous snapshot — live fetch failed.');
            console.error(JSON.stringify(data.scrapeErrors || [], null, 2));
            process.exit(1);
          }
          if (!data.specialties?.length) {
            console.error('No specialties after scrape');
            process.exit(1);
          }
          console.log('Fresh snapshot OK:', data.specialtyCount, 'rows @', data.updatedAt);
          const okForms = data.scrapeMeta?.okFormIds || [];
          const tables = data.tables || [];
          console.log('Live tables:', okForms.length || tables.filter((t) => t.specialtyCount > 0).length);
          if ((okForms.length === 0) && !(tables.some((t) => (t.specialtyCount || 0) > 0))) {
            console.error('No live monitoring tables in snapshot');
            process.exit(1);
          }
          const defaultTable = tables.find((t) => t.id === '7') || tables.find((t) => t.default);
          if (defaultTable && !(defaultTable.specialtyCount > 0) && data.scrapeMeta?.retainedPrevious) {
            console.error('Default daytime-paid table missing after failed scrape');
            process.exit(1);
          }
          EOF

      - name: Commit updated data
        if: success() && steps.changes.outputs.changed == 'true'
        id: commit
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "prohod-bot"
          git config user.email "prohod-bot@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh admission snapshots"

          # Tip can move (manual push / tip-sha / overlapping arm). Rebase + retry.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}) — rebase onto origin/${BRANCH}"
            git fetch origin "${BRANCH}"
            git pull --rebase -X ours origin "${BRANCH}"
          done
          echo "::error::Failed to push scrape data after 3 attempts"
          exit 1

      - name: Publish tip SHA
        if: success() && steps.commit.outputs.pushed == 'true'
        env:
          TIP_SHA: ${{ steps.commit.outputs.sha }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          node --input-type=module <<EOF
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          const tipPath = 'data/latest.json';
          const tip = existsSync(tipPath)
            ? JSON.parse(readFileSync(tipPath, 'utf8'))
            : { universities: [] };
          tip.commitSha = process.env.TIP_SHA;
          tip.publishedAt = new Date().toISOString();
          tip.origin = {
            repo: process.env.GITHUB_REPOSITORY || tip.origin?.repo,
            branch: process.env.BRANCH || tip.origin?.branch,
          };
          writeFileSync(tipPath, JSON.stringify(tip, null, 2) + '\n');
          EOF
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "Tip already had sha"
            exit 0
          fi
          git commit -m "data: publish tip sha"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "Tip push rejected (attempt ${attempt}) — rebase"
            git fetch origin "${BRANCH}"
            git pull --rebase -X ours origin "${BRANCH}"
          done
          echo "::error::Failed to publish tip sha after 3 attempts"
          exit 1

      # Keep ~5-minute cadence without trusting cron or push-tick recursion.
      # workflow_dispatch always starts a run, even with GITHUB_TOKEN.
      # Use -R always — early failures may skip checkout, so cwd is not a git repo.
      - name: Arm next scrape
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -e
          echo "Waiting 180s before arming the next scrape…"
          sleep 180

          # Avoid piling up if cron/manual already queued another run.
          QUEUED=$(gh run list -R "${REPO}" --workflow="Scrape admission tables" --status queued --limit 5 --json databaseId --jq 'length')
          INPROG=$(gh run list -R "${REPO}" --workflow="Scrape admission tables" --status in_progress --limit 5 --json databaseId --jq "[.[] | select(.databaseId != ${THIS_RUN})] | length")
          if [ "${QUEUED:-0}" -gt 0 ] || [ "${INPROG:-0}" -gt 0 ]; then
            echo "Another scrape is already queued/in progress — skip dispatch (queued=${QUEUED}, other_in_progress=${INPROG})"
            exit 0
          fi

          gh workflow run "Scrape admission tables" -R "${REPO}" --ref "${BRANCH}"
          echo "Dispatched next scrape via workflow_dispatch → ${BRANCH}"

name: Scrape admission tables

on:
  schedule:
    # Hourly 06:15–18:15 UTC ≈ 09:15–21:15 Minsk — keep Pages data fresh
    - cron: "15 6-18 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/scrape/**"
      - "sources/universities.json"
      - ".github/workflows/scrape.yml"
      - "js/compute.js"

permissions:
  contents: write
  pages: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve Pages / scrape branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=""
          if [ "${{ github.event_name }}" = "push" ]; then
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH=$(gh api "repos/${{ github.repository }}/pages" --jq '.source.branch' 2>/dev/null || true)
            if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
              BRANCH="${{ github.event.repository.default_branch }}"
            fi
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Scraping branch: $BRANCH"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: npm test

      - name: Scrape universities
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
        run: npm run scrape

      - name: Detect changes
        id: changes
        run: |
          if [ -f data/.changed ] && [ "$(cat data/.changed)" = "1" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f data/.changed

      - name: Fail soft retention on empty scrape
        if: always()
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          const path = 'data/sb-bsu.json';
          if (!existsSync(path)) {
            console.error('missing data/sb-bsu.json');
            process.exit(1);
          }
          const data = JSON.parse(readFileSync(path, 'utf8'));
          if (data.scrapeMeta?.retainedPrevious) {
            console.error('Scrape retained previous snapshot — live fetch failed.');
            console.error(JSON.stringify(data.scrapeErrors || [], null, 2));
            process.exit(1);
          }
          if (!data.specialties?.length) {
            console.error('No specialties after scrape');
            process.exit(1);
          }
          console.log('Fresh snapshot OK:', data.specialtyCount, 'rows @', data.updatedAt);
          EOF

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "prohod-bot"
          git config user.email "prohod-bot@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "data: refresh admission snapshots"
          git push

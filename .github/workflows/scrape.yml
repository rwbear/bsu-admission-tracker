name: Scrape admission tables

# IMPORTANT: schedule events only run from the default branch (main).
# Trigger: keep Schedules on main + push-scrapes on Pages.
# This workflow still checks out the GitHub Pages branch and pushes data there.
on:
  schedule:
    # Every 5 minutes. Dual legacy grids collapsed — one clear cadence.
    # Schedules only fire from default branch (main); keep this file in sync.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "cursor/admission-tracker-rebuild-be86"
    paths:
      - "scripts/scrape/**"
      - "sources/universities.json"
      - ".github/workflows/scrape.yml"
      - "js/compute.js"
      - "package.json"

permissions:
  contents: write
  pages: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: scrape-admission-data
      # Don't cancel a live scrape when another slot/push fires — dropped runs
      # were leaving the site on a 40–60 minute old snapshot.
      cancel-in-progress: false
    steps:
      - name: Resolve Pages / scrape branch
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(gh api "repos/${{ github.repository }}/pages" --jq '.source.branch' 2>/dev/null || true)
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
            BRANCH="cursor/admission-tracker-rebuild-be86"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Scraping Pages branch: $BRANCH"

      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # Scheduled runs skip tests so the job stays short and gets scheduled more
      # reliably under GitHub Actions load. Push/manual still run the suite.
      - name: Run tests
        if: github.event_name != 'schedule'
        run: npm test

      - name: Scrape universities
        env:
          SCRAPE_PROXY: ${{ secrets.SCRAPE_PROXY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROHOD_DATA_BRANCH: ${{ steps.target.outputs.branch }}
        run: npm run scrape

      - name: Detect changes
        id: changes
        run: |
          if [ -f data/.changed ] && [ "$(cat data/.changed)" = "1" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f data/.changed

      - name: Fail soft retention on empty scrape
        if: always()
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, existsSync } from 'node:fs';
          const path = 'data/sb-bsu.json';
          if (!existsSync(path)) {
            console.error('missing data/sb-bsu.json');
            process.exit(1);
          }
          const data = JSON.parse(readFileSync(path, 'utf8'));
          if (data.scrapeMeta?.retainedPrevious) {
            console.error('Scrape retained previous snapshot — live fetch failed.');
            console.error(JSON.stringify(data.scrapeErrors || [], null, 2));
            process.exit(1);
          }
          if (!data.specialties?.length) {
            console.error('No specialties after scrape');
            process.exit(1);
          }
          console.log('Fresh snapshot OK:', data.specialtyCount, 'rows @', data.updatedAt);
          EOF

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        id: commit
        run: |
          git config user.name "prohod-bot"
          git config user.email "prohod-bot@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh admission snapshots"
          git push origin "HEAD:${{ steps.target.outputs.branch }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Publish the exact commit SHA so clients can fetch SHA-pinned raw URLs.
      # Branch-tip raw.githubusercontent.com is CDN-stale even with ?bust=.
      - name: Publish tip SHA
        if: steps.commit.outputs.pushed == 'true'
        run: |
          SHA="${{ steps.commit.outputs.sha }}"
          BRANCH="${{ steps.target.outputs.branch }}"
          node --input-type=module <<EOF
          import { readFileSync, writeFileSync, existsSync } from 'node:fs';
          const tipPath = 'data/latest.json';
          const tip = existsSync(tipPath)
            ? JSON.parse(readFileSync(tipPath, 'utf8'))
            : { universities: [] };
          tip.commitSha = process.env.TIP_SHA;
          tip.publishedAt = new Date().toISOString();
          writeFileSync(tipPath, JSON.stringify(tip, null, 2) + '\n');
          EOF
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "Tip already had sha"
            exit 0
          fi
          git commit -m "data: publish tip sha"
          git push origin "HEAD:${BRANCH}"
        env:
          TIP_SHA: ${{ steps.commit.outputs.sha }}
